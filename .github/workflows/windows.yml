# The Windows installer, as this run's artifact (scriptlens-windows) — never attached to a release from here: Windows is
# published only after a check on a real Windows PC, and then that very file goes to the release by hand (RELEASE.md).
# Checked here: the unit tests, the build, and that the app — unpacked, then installed by the installer — opens its
# window and shows lab's page (--smoke-test). Captions are NOT fetched here: a datacenter IP is likely to be refused by
# YouTube.
name: windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci
        env:
          # electron-builder fetches the Windows Electron itself; the dev binary is not needed here
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Unit tests
        run: npm test

      - name: Build the installer
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Smoke test — the unpacked app
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist-win\win-unpacked\ScriptLens.exe" -ArgumentList "--smoke-test=smoke\unpacked" -PassThru -Wait
          Get-Content smoke\unpacked\smoke.json
          if ($p.ExitCode -ne 0) { Write-Error "smoke test failed ($($p.ExitCode))"; exit 1 }

      - name: Smoke test — installed by the installer (silent, per user)
        shell: pwsh
        run: |
          Start-Process -FilePath "dist-win\ScriptLens-win-x64-setup.exe" -ArgumentList "/S" -Wait
          # a per-user install goes under %LOCALAPPDATA%\Programs, in a folder named after package.json's "name"
          $found = Get-ChildItem (Join-Path $env:LOCALAPPDATA "Programs") -Recurse -Filter ScriptLens.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $found) { Write-Error "ScriptLens.exe not found under $env:LOCALAPPDATA\Programs"; exit 1 }
          $exe = $found.FullName
          "installed at $exe"
          $p = Start-Process -FilePath $exe -ArgumentList "--smoke-test=smoke\installed" -PassThru -Wait
          Get-Content smoke\installed\smoke.json
          if ($p.ExitCode -ne 0) { Write-Error "smoke test failed ($($p.ExitCode))"; exit 1 }

      - name: The names a person sees — Start menu, desktop shortcut, the uninstall list, the window
        shell: pwsh
        run: |
          $bad = @()
          $start = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs"
          $lnk = Get-ChildItem $start -Recurse -Filter *.lnk | Where-Object { $_.Name -like '*cript*' }
          "Start menu: $($lnk.FullName -join ', ')"
          if (-not ($lnk | Where-Object { $_.Name -eq 'ScriptLens.lnk' })) { $bad += 'Start menu' }
          $desk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'ScriptLens.lnk'
          "Desktop: $desk exists=$(Test-Path $desk)"
          if (-not (Test-Path $desk)) { $bad += 'desktop shortcut' }
          $u = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' | Where-Object { $_.DisplayName -like '*cript*' }
          $u | Select-Object DisplayName, Publisher, DisplayVersion, InstallLocation | Format-List | Out-String
          if (-not ($u | Where-Object { $_.DisplayName -eq 'ScriptLens' })) { $bad += 'uninstall list' }
          $s = Get-Content smoke\installed\smoke.json | ConvertFrom-Json
          "Window title: $($s.windowTitle)"
          if ($s.windowTitle -ne 'ScriptLens') { $bad += 'window title' }
          if ($bad.Count) { Write-Error "not ScriptLens: $($bad -join ', ')"; exit 1 }

      - name: SHA-256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist-win\ScriptLens-win-x64-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$h  ScriptLens-win-x64-setup.exe" | Out-File -Encoding ascii dist-win\SHA256SUMS-win.txt
          Get-Content dist-win\SHA256SUMS-win.txt

      - uses: actions/upload-artifact@v4
        with:
          name: scriptlens-windows
          path: |
            dist-win/ScriptLens-win-x64-setup.exe
            dist-win/SHA256SUMS-win.txt
            smoke/**
