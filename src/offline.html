<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>ScriptLens — 연결할 수 없음</title>
<style>
  :root { --bg: #ffffff; --fg: #111827; --muted: #6b7280; --line: #e5e7eb; --btn: #111827; --btn-fg: #ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #030712; --fg: #f3f4f6; --muted: #9ca3af; --line: #1f2937; --btn: #f3f4f6; --btn-fg: #111827; }
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif; }
  main { max-width: 32rem; margin: 0 auto; padding: 18vh 24px 0; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: var(--muted); }
  code { font-size: 12px; }
  button { margin-top: 12px; border: 0; border-radius: 6px; padding: 8px 16px; background: var(--btn); color: var(--btn-fg);
    font: inherit; font-size: 14px; cursor: pointer; }
  .reason { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 12px; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>ScriptLens 화면을 열 수 없습니다</h1>
  <p id="why">인터넷에 연결되어 있지 않거나 lab.mindvest.ai에 접속할 수 없습니다.</p>
  <p>연결을 확인한 뒤 다시 시도해 주세요. 인터넷이 다시 연결되면 저절로 다시 엽니다.</p>
  <button id="retry" type="button">다시 시도</button>
  <p class="reason">사유: <code id="reason"></code></p>
</main>
<script>
  const q = new URLSearchParams(location.search);
  const target = q.get('url') || '';
  document.getElementById('reason').textContent = q.get('reason') || '알 수 없음';
  const go = () => { if (/^https?:\/\//.test(target)) location.href = target; };
  document.getElementById('retry').addEventListener('click', go);
  window.addEventListener('online', () => setTimeout(go, 800));
</script>
</body>
</html>
